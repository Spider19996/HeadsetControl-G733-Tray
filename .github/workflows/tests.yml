# Runs the tests on every push (to branches) and on every pull request.
name: tests
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    container: fedora:latest  # current Python and PyQt6 from the distribution, like the program itself
    steps:
      - run: dnf install -y python3-pyqt6
      - uses: actions/checkout@v7
      - run: python3 --version
      - run: python3 -m unittest discover -s tests -t .
        env:
          QT_QPA_PLATFORM: offscreen
