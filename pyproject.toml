[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "g733-tray"
dynamic = ["version"]
description = "KDE Plasma tray application for the Logitech G733: battery level, light, notifications"
readme = "README.md"
requires-python = ">=3.9"  # only tested with Python 3.14
license = {text = "MIT"}
authors = [{name = "Spider19996"}]
# PyQt6 comes from the system package (python3-pyqt6), not from pip: only its Qt knows the Plasma style
dependencies = []

[project.scripts]
g733-tray = "g733_tray.app:run"

[tool.setuptools]
packages = ["g733_tray", "g733_tray.lang"]

[tool.setuptools.dynamic]
version = {attr = "g733_tray.__version__"}
